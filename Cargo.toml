[package]
name = "whisper_serverless"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
byteorder = "1.5.0"
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.9.1", features = [
    "cuda",
] }
candle-examples = { git = "https://github.com/huggingface/candle.git", version = "0.9.1", features = [
    "cuda",
] }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.9.1", features = [
    "cuda",
] }
candle-transformers = { git = "https://github.com/huggingface/candle.git", version = "0.9.1", features = [
    "cuda",
] }
clap = { version = "4.2.4", features = ["derive"] }
cpal = "0.16.0"
hf-hub = "0.4.3"
rand = "0.9.1"
rubato = "0.16.2"
serde_json = "1.0.140"
tokenizers = "0.21.2"
tracing-subscriber = "0.3.19"
tracing-chrome = "0.7.2"
axum = { version = "0.8.4", features = ["macros"] }
tokio = "1.46.1"
reqwest = { version = "0.11", features = ["json"] }
